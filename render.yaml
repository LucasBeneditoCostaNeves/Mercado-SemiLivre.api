services:
  - type: web
    name: mercado-semilivre-api
    runtime: node
    buildCommand: npm install && npm run build && npx prisma generate
    preDeployCommand: npx prisma migrate deploy
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
