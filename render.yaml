services:
  - type: web
    name: mercado-semilivre-api
    runtime: node
    # preDeployCommand exige plano pago no Render — no plano free ele é ignorado
    # silenciosamente, então as migrations rodam aqui dentro do build (idempotente).
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
